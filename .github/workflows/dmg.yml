name: macOS-DMG

# Builds the DMG on a GitHub Mac, so a release needs no Mac at home. The APK and the
# Linux packages are attached when the release is created; this adds the DMG and
# refreshes SHA256SUMS.txt.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, an den das DMG gehängt wird (leer = nur bauen)"
        required: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: DMG bauen
        run: ./gradlew --console=plain :shared:desktopTest :desktopApp:packageDmg
      - name: Umbenennen
        run: |
          VERSION="$(sed -n 's/^app = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "dist/HolzAffe_${VERSION}_macos-arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
      - name: An das Release hängen
        if: env.TAG != ''
        run: |
          gh release upload "$TAG" dist/*.dmg --clobber
          mkdir all && cd all
          gh release download "$TAG" --pattern 'HolzAffe_*'
          shasum -a 256 HolzAffe_* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
